syntax = "proto3";

option java_multiple_files = true;
option java_package = "ovh.eukon05.lokit.common.proto";
option java_outer_classname = "IdentityServiceProto";

message CheckUserExistsRequest {
  string userId = 1;
}

message CheckUserExistsReply {
  bool exists = 1;
}

service IdentityService {
  rpc CheckUserExists (CheckUserExistsRequest) returns (CheckUserExistsReply) {}
}